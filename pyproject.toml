[project]
name = "ai-skin-specialist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swaraj Zade", email = "swarajzade2711@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "deepgram-sdk>=7.19.0",
    "gradio>=6.32.0",
    "groq>=1.7.0",
    "openai>=3.55.0",
    "opencv-python>=5.1.0.95",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "speechrecognition>=3.17.0",
]

[project.scripts]
ai-skin-specialist = "ai_skin_specialist:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
